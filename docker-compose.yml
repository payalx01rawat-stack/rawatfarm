services:
  mysql:
    image: mysql:8.4
    container_name: farmmitra-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farmmitra
      MYSQL_USER: farmmitra
      MYSQL_PASSWORD: farmmitra
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - farmmitra_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: farmmitra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - farmmitra_redis:/data
volumes:
  farmmitra_mysql:
  farmmitra_redis:
